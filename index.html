<style>
  :root {
    --bg: #0c0c12;
    --surface: #14141c;
    --surface-2: #1c1c28;
    --border: #262636;
    --text: #ececf2;
    --muted: #9a9ab0;
    --accent: #8b7cf6;
    --accent-2: #5ec8e8;
    --accent-grad: linear-gradient(135deg, #8b7cf6 0%, #5ec8e8 100%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", "Noto Sans JP", "Noto Sans KR", "Helvetica Neue", sans-serif;
    line-height: 1.7;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }
  .lang-wrap {
    display: flex; justify-content: flex-end;
    padding: 20px 0 0;
  }
  .lang-select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 11px;
    border-radius: 7px;
    font-size: 12.5px;
    font-family: inherit;
    min-width: 160px;
  }
  .hero {
    padding: 48px 0 40px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .hero h1 {
    font-size: 28px; font-weight: 700; letter-spacing: -0.5px;
    margin-bottom: 10px;
    background: var(--accent-grad);
    -webkit-background-clip: text;
    color: transparent;
  }
  .hero .date-note {
    color: var(--muted);
    font-size:14px;
  }
  section { padding: 40px 0; border-bottom: 1px solid var(--border); }
  section:last-of-type { border-bottom: none; }
  h2 {
    font-size: 19px; font-weight: 700; margin:28px 0 10px;
    display: flex; align-items: center; gap: 10px;
  }
  h2::before {
    content: ""; width: 4px; height: 18px; border-radius: 2px;
    background: var(--accent-grad);
  }
  p {
    color: var(--muted);
    margin:10px 0;
    text-align: justify;
  }
  ul,ol {
    padding-left:22px;
    margin:10px 0;
    color:var(--muted);
  }
  li {
    margin:6px 0;
  }
  strong { color:var(--text); font-weight:600; }
  .note-box{
    margin-top:22px;
    padding:14px;
    background:rgba(139,124,246,0.08);
    border-radius:8px;
    text-align:center;
    font-size:14px;
    color:var(--muted);
  }
  footer {
    padding: 32px 0 48px;
    text-align: center;
    color: var(--muted); font-size: 12.5px;
  }
  footer .links { margin-bottom: 10px; }
  footer .links a { margin: 0 10px; }
  @media (max-width: 600px) {
    .hero { padding: 32px 0 28px; }
    .hero h1 { font-size: 22px; }
    h2 { font-size: 17px; }
  }

</head>

</div>

const LANGS = ["zh-CN","zh-TW","en","ja","ko","de-DE","fr-FR"];
let currentLang = "zh-CN";
const selectEl = document.getElementById("langSelect");
const contentBody = document.getElementById("contentBody");

LANGS.forEach(l=>{
  const opt = document.createElement("option");
  opt.value = l;
  opt.textContent = I18N[l].langName;
  selectEl.appendChild(opt);
});

selectEl.onchange = ()=>{
  setLang(selectEl.value);
};

function setLang(langKey){
  currentLang = langKey;
  const t = I18N[langKey] ?? I18N["en"];
  document.title = t.title + " | LumoConvert";
  document.documentElement.lang = langKey;
  selectEl.value = langKey;

  document.querySelector("[data-i18n='title']").textContent = t.title;
  document.querySelector("[data-i18n='effectiveDate']").textContent = t.effectiveDate;
  document.querySelector("[data-i18n='linkPrivacy']").textContent = t.linkPrivacy;
  document.querySelector("[data-i18n='linkTerms']").textContent = t.linkTerms;
  document.querySelector("[data-i18n='linkSubscription']").textContent = t.linkSubscription;

  contentBody.innerHTML = t.html;
  localStorage.setItem("sub_lang", langKey);
}

function detectLang(){
  const nav = (navigator.language || "en").toLowerCase();
  if(nav.startsWith("zh")){
    if(nav.includes("tw") || nav.includes("hk")) return "zh-TW";
    return "zh-CN";
  }
  for(const l of LANGS){
    if(nav.startsWith(l.toLowerCase())) return l;
  }
  return "en";
}

(function init(){
  const saved = localStorage.getItem("sub_lang");
  const initLang = (saved && I18N[saved]) ? saved : detectLang();
  setLang(initLang);
})();
</script>
</body>
</html>
